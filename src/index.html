<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TreeHouse</title>
</head>
<body>
    <canvas class="webgl"></canvas>
    <div class="loading-bar"></div>
    <div id="loading-percentage" class="loading-percentage">0%</div>

    <div class="ui">
        <div class="mode" role="group" aria-label="View mode">
            <button type="button" data-mode="fly">Fly</button>
            <button type="button" data-mode="walk">Walk</button>
        </div>
        <p class="hint" aria-live="polite"></p>
    </div>
    <button type="button" class="forward" aria-label="Walk forward" hidden>&#8593;</button>
</body>
</html>
